# CI - Wheel Tests (Nightly/Release)
#
# TESTING ONLY: This workflow has been stripped down to only run ROCm tests.
# All other jobs (CPU, CUDA, TPU, Bazel tests, and verification) have been removed.
# This is a temporary modification for testing purposes.
#
# DO NOT MERGE - Restore full workflow before merging.
name: CI - Wheel Tests (Nightly/Release) [TESTING - ROCm ONLY]

on:
  workflow_dispatch:
    inputs:
      gcs_download_uri:
        description: "GCS location URI from where the artifacts should be downloaded"
        required: true
        default: 'gs://jax-nightly-artifacts/latest'
        type: string
      skip-download-jaxlib-and-plugins-from-gcs:
        description: "Whether to download only the jax wheel from GCS (e.g for testing a jax only release)"
        required: true
        default: '0'
        type: string
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection? (yes/no)'
        required: false
        default: 'no'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions: {}

env:
  UV_DEFAULT_INDEX: "https://us-python.pkg.dev/ml-oss-artifacts-published/pypi-mirror/simple"

jobs:
  run-pytest-rocm:
    uses: ./.github/workflows/pytest_rocm.yml
    strategy:
        fail-fast: false # don't cancel all jobs on failure
        matrix:
          runner: ["linux-x86-64-1gpu-amd", "linux-x86-64-4gpu-amd"]
          python: ["3.11", "3.12"]
          rocm: [
            {version: "7.2.0", tag: "rocm720"},
          ]
    name: "Pytest ROCm (JAX artifacts version = ${{ startsWith(github.ref_name, 'release/') && 'latest release' || 'nightly' }})"
    with:
      runner: ${{ matrix.runner }}
      python: ${{ matrix.python }}
      rocm-version: ${{ matrix.rocm.version }}
      rocm-tag: ${{ matrix.rocm.tag }}
      jaxlib-version: "head"
      skip-download-jaxlib-and-rocm-plugins-from-gcs: ${{inputs.skip-download-jaxlib-and-plugins-from-gcs}}
      gcs_download_uri: ${{inputs.gcs_download_uri}}
