# CI - Build ROCm Artifacts
# This workflow builds ROCm wheels (jax-rocm-plugin, jax-rocm-pjrt) and, on request, the
# jax and jaxlib wheels that go with them, in a ROCm container, and uploads them to an S3
# bucket. It can be triggered manually via workflow_dispatch or called via workflow_call.
name: CI - Build ROCm Artifacts

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Which runner should the workflow run on?"
        type: choice
        default: "amd-do-linux.jax.cpu"
        options:
        - "amd-do-linux.jax.cpu"
      artifact:
        description: "Which artifact to build?"
        type: choice
        default: "jax-rocm-plugin"
        options:
        - "jax-rocm-plugin"
        - "jax-rocm-pjrt"
        - "jax"
        - "jaxlib"
      python:
        description: "Which python version should the artifact be built for?"
        type: choice
        default: "3.12"
        options:
        - "3.12"
        - "3.13"
        - "3.14"
        - "3.15"
      rocm-version:
        description: "Which ROCm version to build for?"
        type: string
        default: "7"
      rocm-release-version:
        description: "Full ROCm release version (e.g., 7.2.0) for container image and S3 paths"
        type: string
        default: "7.2.0"
      rocm-tag:
        description: "TheRock release to pip-install (e.g. therock-10.0, therock-latest)"
        type: string
        default: "therock-10.0"
      clone_main_xla:
        description: "Should latest XLA be used?"
        type: choice
        default: "1"
        options:
        - "1"
        - "0"
      artifact-type:
        description: "Which version scheme to stamp the wheel with: default (X.Y.Z.dev<date>+<hash>), nightly (X.Y.Z.dev<date>) or release (X.Y.Z, plus wheel-version-suffix)."
        type: choice
        default: "default"
        options:
        - "default"
        - "nightly"
        - "release"
      wheel-version-suffix:
        description: "Custom wheel version suffix, e.g. rc1 (needs artifact-type release) or .post3. Leave empty for normal builds."
        type: string
        default: ""
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
        - 'yes'
        - 'no'
  workflow_call:
    inputs:
      runner:
        description: "Which runner should the workflow run on?"
        type: string
        default: "amd-do-linux.jax.cpu"
      artifact:
        description: "Which artifact to build? One of jax-rocm-plugin, jax-rocm-pjrt, jax, jaxlib."
        type: string
        default: "jax-rocm-plugin"
      python:
        description: "Which python version should the artifact be built for?"
        type: string
        default: "3.12"
      rocm-version:
        description: "Which ROCm version to build for?"
        type: string
        default: "7"
      rocm-release-version:
        description: "Full ROCm release version (e.g., 7.2.0) for container image and S3 paths"
        type: string
        default: "7.2.0"
      rocm-tag:
        description: "TheRock release to pip-install (e.g. therock-10.0, therock-latest)"
        type: string
        default: "therock-10.0"
      clone_main_xla:
        description: "Should latest XLA be used?"
        type: string
        default: "1"
      upload_artifacts_to_s3:
        description: "Should the artifacts be uploaded to S3?"
        default: true
        type: boolean
      s3_upload_uri:
        description: "S3 location prefix to where the artifacts should be uploaded"
        default: 's3://jax-ci-amd/jax-rocm-plugin-wheels'
        type: string
      artifact-type:
        description: "Which version scheme to stamp the wheel with: default (X.Y.Z.dev<date>+<hash>), nightly (X.Y.Z.dev<date>) or release (X.Y.Z, plus wheel-version-suffix)."
        type: string
        default: "default"
      wheel-version-suffix:
        description: "Custom wheel version suffix, e.g. rc1 (needs artifact-type release) or .post3. Leave empty for normal builds."
        type: string
        default: ""
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: string
        default: 'no'
      git_commit:
        description: "Commit SHA to check out for building artifacts"
        required: false
        default: ""
        type: string
    outputs:
      s3_upload_uri:
        description: "S3 location prefix to where the artifacts were uploaded"
        value: ${{ jobs.build-artifacts.outputs.s3_upload_uri }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build-artifacts:
    defaults:
      run:
        shell: bash
    runs-on: ${{ inputs.runner }}
    outputs:
      s3_upload_uri: ${{ steps.store-s3-upload-uri.outputs.s3_upload_uri }}
    container:
      image: ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:fe966c6f77ad7dcd279bad02833d4cd70f72a9cd87640912ae37b20b3de7edea
      volumes:
        - /data:/data
      options: >-
        --shm-size 64G

    env:
      JAXCI_HERMETIC_PYTHON_VERSION: "${{ inputs.python }}"
      JAXCI_CLONE_MAIN_XLA: "${{ inputs.clone_main_xla }}"
      JAXCI_OUTPUT_DIR: "${{ github.workspace }}/dist"
      JAXCI_ARTIFACT_TYPE: "${{ inputs.artifact-type }}"
      JAXCI_WHEEL_VERSION_SUFFIX: "${{ inputs.wheel-version-suffix }}"

    name: "${{ inputs.artifact }}, py ${{ inputs.python }}, ROCm ${{ inputs.rocm-release-version || inputs.rocm-version }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_commit }}
          persist-credentials: false
      - name: Install Bazelisk
        run: |
          curl -fSsL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
      # Halt for testing
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Install TheRock (ROCm via pip)
        env:
          ROCM_TAG: ${{ inputs.rocm-tag }}
        run: |
          set -euo pipefail
          case "${ROCM_TAG}" in
            therock-latest) index=https://nightly.repo.amd.com/rocm/whl-next/; pin="" ;;
            therock-7.14) index=https://repo.amd.com/rocm/whl-multi-arch/; pin=7.14 ;;
            therock-*) index=https://stable.repo.amd.com/rocm/whl-next/; pin="${ROCM_TAG#therock-}" ;;
            *) echo "::error::rocm-tag '${ROCM_TAG}' has no TheRock pip release"; exit 1 ;;
          esac
          if [[ "${index}" == *whl-next* ]]; then index="${ROCM_PIP_INDEX_URL:-${index}}"; fi
          python3.12 -m pip install --break-system-packages --pre --index-url "${index}" \
            "rocm[libraries,devel,device-gfx942,device-gfx950]${pin:+==}${pin}"
          rocm-sdk init
          rocm-sdk path --root
      - name: Build ${{ inputs.artifact }}
        timeout-minutes: 120
        run: ./ci/build_rocm_artifacts.sh "$INPUTS_ARTIFACT"
        env:
          INPUTS_ARTIFACT: ${{ inputs.artifact }}
      - name: Configure AWS Credentials
        if: ${{ inputs.upload_artifacts_to_s3 }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::661452401056:role/jax-ci-amd-s3-oidc
          aws-region: us-east-1
      - name: Upload artifacts to S3
        if: ${{ inputs.upload_artifacts_to_s3 }}
        run: |
          echo "Uploading wheels to S3..."
          ls -lh "$JAXCI_OUTPUT_DIR"/*.whl
          aws s3 cp --only-show-errors --recursive "$JAXCI_OUTPUT_DIR"/ "${INPUTS_S3_UPLOAD_URI}"/
          echo "Upload complete."

          LATEST_KEY="rocm-wheels/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${INPUTS_ROCM_RELEASE_VERSION}/LATEST"
          echo "${INPUTS_S3_UPLOAD_URI}" | \
            aws s3 cp --only-show-errors - "s3://jax-ci-amd/${LATEST_KEY}"
        env:
          INPUTS_S3_UPLOAD_URI: ${{ inputs.s3_upload_uri }}
          INPUTS_ROCM_RELEASE_VERSION: ${{ inputs.rocm-release-version }}
      - name: Store the S3 upload URI as an output
        if: ${{ inputs.upload_artifacts_to_s3 }}
        id: store-s3-upload-uri
        run: echo "s3_upload_uri=${INPUTS_S3_UPLOAD_URI}" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_S3_UPLOAD_URI: ${{ inputs.s3_upload_uri }}
