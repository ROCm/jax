# CI - Build ROCm Artifacts
# This workflow builds ROCm wheels (jax-rocm-plugin, jax-rocm-pjrt) in a ROCm container
# and uploads them to an S3 bucket. It can be triggered manually via workflow_dispatch or
# called by other workflows via workflow_call.
name: CI - Build ROCm Artifacts

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Which runner should the workflow run on?"
        type: choice
        default: "amd-do-linux.jax.cpu"
        options:
        - "amd-do-linux.jax.cpu"
        - "amd-do-linux.jax.cpu-nodind"
      artifact:
        description: "Which ROCm artifact to build?"
        type: choice
        default: "jax-rocm-plugin"
        options:
        - "jax-rocm-plugin"
        - "jax-rocm-pjrt"
      python:
        description: "Which python version should the artifact be built for?"
        type: choice
        default: "3.12"
        options:
        - "3.12"
        - "3.13"
        - "3.14"
      rocm-version:
        description: "Which ROCm version to build for?"
        type: string
        default: "7"
      rocm-release-version:
        description: "Full ROCm release version (e.g., 7.2.0) for container image and S3 paths"
        type: string
        default: "7.2.0"
      manylinux-image:
        description: "Override the manylinux container image (e.g., ghcr.io/rocm/jax-manylinux_2_28-therock-latest:latest)"
        type: string
        default: ""
      clone_main_xla:
        description: "Should latest XLA be used?"
        type: choice
        default: "1"
        options:
        - "1"
        - "0"
      artifact-type:
        description: "Type of artifact to build (default/nightly/release). Controls wheel version stamping."
        type: choice
        default: "default"
        options:
        - "default"
        - "nightly"
        - "release"
      wheel-version-suffix:
        description: "Version suffix for post-releases (e.g., .post3). Leave empty for normal builds."
        type: string
        default: ""
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        default: 'no'
        options:
        - 'yes'
        - 'no'
  workflow_call:
    inputs:
      runner:
        description: "Which runner should the workflow run on?"
        type: string
        default: "amd-do-linux.jax.cpu"
      artifact:
        description: "Which ROCm artifact to build?"
        type: string
        default: "jax-rocm-plugin"
      python:
        description: "Which python version should the artifact be built for?"
        type: string
        default: "3.12"
      rocm-version:
        description: "Which ROCm version to build for?"
        type: string
        default: "7"
      rocm-release-version:
        description: "Full ROCm release version (e.g., 7.2.0) for container image and S3 paths"
        type: string
        default: "7.2.0"
      manylinux-image:
        description: "Override the manylinux container image (e.g., ghcr.io/rocm/jax-manylinux_2_28-therock-latest:latest)"
        type: string
        default: ""
      clone_main_xla:
        description: "Should latest XLA be used?"
        type: string
        default: "1"
      upload_artifacts_to_s3:
        description: "Should the artifacts be uploaded to S3?"
        default: true
        type: boolean
      s3_upload_uri:
        description: "S3 location prefix to where the artifacts should be uploaded"
        default: 's3://jax-ci-amd/jax-rocm-plugin-wheels'
        type: string
      artifact-type:
        description: "Type of artifact to build (default/nightly/release). Controls wheel version stamping."
        type: string
        default: "default"
      wheel-version-suffix:
        description: "Version suffix for post-releases (e.g., .post3). Leave empty for normal builds."
        type: string
        default: ""
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: string
        default: 'no'
    outputs:
      s3_upload_uri:
        description: "S3 location prefix to where the artifacts were uploaded"
        value: ${{ jobs.build-artifacts.outputs.s3_upload_uri }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build-artifacts:
    defaults:
      run:
        shell: bash
    runs-on: ${{ inputs.runner }}
    outputs:
      s3_upload_uri: ${{ steps.store-s3-upload-uri.outputs.s3_upload_uri }}
    container:
      image: "${{ inputs.manylinux-image || format('ghcr.io/rocm/jax-manylinux_2_28-rocm-{0}:latest', inputs.rocm-release-version) }}"  # zizmor: ignore[unpinned-images]
      volumes:
        - /data:/data
      options: >-
        --security-opt seccomp=unconfined
        --shm-size 64G

    env:
      JAXCI_HERMETIC_PYTHON_VERSION: "${{ inputs.python }}"
      JAXCI_CLONE_MAIN_XLA: "${{ inputs.clone_main_xla }}"
      JAXCI_OUTPUT_DIR: "${{ github.workspace }}/dist"
      JAXCI_ARTIFACT_TYPE: "${{ inputs.artifact-type }}"

    name: "${{ inputs.artifact }}, py ${{ inputs.python }}, ROCm ${{ inputs.rocm-version }}"

    steps:
      # Shell checkout: true no-dind runners lack /__e for JS actions.
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --depth=1 --no-tags --prune --no-recurse-submodules origin ${{ github.sha }}
          git checkout ${{ github.sha }}
      - name: Install Bazelisk
        run: |
          curl -fSsL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
      # Halt for testing
      - name: Wait For Connection
        run: |
          if [[ "${{ inputs.halt-for-connection }}" == "yes" ]]; then
            echo "halt-for-connection not supported without dind" && exit 1
          fi
      - name: Build ${{ inputs.artifact }}
        timeout-minutes: 120
        run: ./ci/build_rocm_artifacts.sh "$INPUTS_ARTIFACT"
        env:
          INPUTS_ARTIFACT: ${{ inputs.artifact }}
          JAXCI_WHEEL_VERSION_SUFFIX: ${{ inputs.wheel-version-suffix }}
      - name: Configure AWS Credentials
        if: ${{ inputs.upload_artifacts_to_s3 }}
        run: |
          OIDC_TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::661452401056:role/jax-ci-amd-s3-oidc \
            --role-session-name gha \
            --web-identity-token "$OIDC_TOKEN" \
            --region us-east-1)
          echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r .Credentials.AccessKeyId)" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r .Credentials.SecretAccessKey)" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo $CREDS | jq -r .Credentials.SessionToken)" >> $GITHUB_ENV
      - name: Upload artifacts to S3
        if: ${{ inputs.upload_artifacts_to_s3 }}
        run: |
          echo "Uploading wheels to S3..."
          ls -lh "$JAXCI_OUTPUT_DIR"/*.whl
          aws s3 cp --only-show-errors --recursive "$JAXCI_OUTPUT_DIR"/ "${INPUTS_S3_UPLOAD_URI}"/
          echo "Upload complete."

          LATEST_KEY="rocm-wheels/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/${INPUTS_ROCM_RELEASE_VERSION}/LATEST"
          echo "${INPUTS_S3_UPLOAD_URI}" | \
            aws s3 cp --only-show-errors - "s3://jax-ci-amd/${LATEST_KEY}"
        env:
          INPUTS_S3_UPLOAD_URI: ${{ inputs.s3_upload_uri }}
          INPUTS_ROCM_RELEASE_VERSION: ${{ inputs.rocm-release-version }}
      - name: Store the S3 upload URI as an output
        if: ${{ inputs.upload_artifacts_to_s3 }}
        id: store-s3-upload-uri
        run: echo "s3_upload_uri=${INPUTS_S3_UPLOAD_URI}" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_S3_UPLOAD_URI: ${{ inputs.s3_upload_uri }}
