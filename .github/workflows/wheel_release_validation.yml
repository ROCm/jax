# CI - Release Validation (ROCm)
#
# Standalone workflow for validating ROCm release wheels.
# Builds ROCm plugin/PJRT wheels, installs jax/jaxlib from PyPI,
# downloads ROCm wheels from S3, and runs the pytest suite.
# Supports both Legacy ROCm and TheRock.
name: CI - Release Validation (ROCm)

on:
  workflow_dispatch:
    inputs:
      jax-version:
        description: "JAX/jaxlib version to install from PyPI"
        type: string
        default: "0.10.0"
      halt-for-connection:
        description: "Should this workflow run wait for a remote connection? (yes/no)"
        required: false
        default: "no"
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  build-rocm-artifacts:
    if: github.repository_owner == 'ROCm'
    uses: ./.github/workflows/build_rocm_artifacts.yml
    permissions:
      id-token: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: ["linux-x86-64-1gpu-amd"]
        artifact: ["jax-rocm-plugin", "jax-rocm-pjrt"]
        python: ["3.11", "3.12", "3.13", "3.14"]
        rocm: [
          {label: "ROCm 7.2.0", wheel-version: "7", release-version: "7.2.0", manylinux-image: ""},
          {label: "TheRock 7.13.0", wheel-version: "7", release-version: "therock-7.13.0", manylinux-image: "ghcr.io/rocm/jax-manylinux_2_28-therock-latest:latest"},
        ]
        exclude:
          - artifact: "jax-rocm-pjrt"
            python: "3.12"
          - artifact: "jax-rocm-pjrt"
            python: "3.13"
          - artifact: "jax-rocm-pjrt"
            python: "3.14"
    name: "Build ROCm artifacts (${{ matrix.rocm.label }})"
    with:
      runner: ${{ matrix.runner }}
      artifact: ${{ matrix.artifact }}
      artifact-type: "release"
      python: ${{ matrix.python }}
      rocm-version: ${{ matrix.rocm.wheel-version }}
      rocm-release-version: ${{ matrix.rocm.release-version }}
      manylinux-image: ${{ matrix.rocm.manylinux-image }}
      clone_main_xla: 0
      upload_artifacts_to_s3: true
      s3_upload_uri: 's3://jax-ci-amd/rocm-wheels/${{ github.repository }}/${{ github.ref_name }}/${{ matrix.rocm.release-version }}/release-validation/${{ github.run_number }}/${{ github.run_attempt }}'

  run-pytest-rocm:
    if: ${{ !cancelled() && github.repository_owner == 'ROCm' }}
    needs: [build-rocm-artifacts]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        runner: ["linux-x86-64-1gpu-amd", "linux-x86-64-4gpu-amd", "linux-x86-64-8gpu-amd"]
        python: ["3.11", "3.12", "3.13", "3.14"]
        rocm: [
          {label: "ROCm 7.2.0", release-version: "7.2.0", image: "ghcr.io/rocm/jax-base-ubu24.rocm720:latest", needs-sysdeps-fix: "false"},
          {label: "TheRock 7.13.0", release-version: "therock-7.13.0", image: "ghcr.io/rocm/jax-base-ubu24.therock-latest:latest", needs-sysdeps-fix: "true"},
        ]
    name: "Pytest ROCm (${{ matrix.rocm.label }})"
    container:
      image: ${{ matrix.rocm.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --security-opt seccomp=unconfined --group-add video --shm-size 64G --env-file /etc/podinfo/gha-gpu-isolation-settings
    env:
      JAXCI_HERMETIC_PYTHON_VERSION: ${{ matrix.python }}
      JAXCI_PYTHON: "python${{ matrix.python }}"
      JAXCI_ENABLE_X64: "0"
      JAXCI_ROCM_VERSION: "7"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Apply TheRock sysdeps fix (hwloc + pciaccess)
        if: matrix.rocm.needs-sysdeps-fix == 'true'
        run: |
          THEROCK_TARBALL_URL="https://therock-nightly-tarball.s3.amazonaws.com/therock-dist-linux-gfx950-dcgpu-7.13.0a20260501.tar.gz"
          mkdir -p /tmp/therock-fix && cd /tmp/therock-fix
          curl -L "$THEROCK_TARBALL_URL" | tar -xz \
            "./lib/rocm_sysdeps/lib/librocm_sysdeps_hwloc.so.5" \
            "./lib/rocm_sysdeps/lib/librocm_sysdeps_pciaccess.so.0" \
            "./lib/rocm_sysdeps/lib/librocm_sysdeps_asm.so.1"
          cp lib/rocm_sysdeps/lib/librocm_sysdeps_hwloc.so.5 /opt/rocm/lib/rocm_sysdeps/lib/
          cp lib/rocm_sysdeps/lib/librocm_sysdeps_pciaccess.so.0 /opt/rocm/lib/rocm_sysdeps/lib/
          cp lib/rocm_sysdeps/lib/librocm_sysdeps_asm.so.1 /opt/rocm/lib/rocm_sysdeps/lib/
      - name: Download jax and jaxlib from PyPI
        run: |
          mkdir -p $(pwd)/dist
          $JAXCI_PYTHON -m pip download jax==${{ inputs.jax-version }} jaxlib==${{ inputs.jax-version }} --no-deps -d $(pwd)/dist/
      - name: Download ROCm wheels from S3
        run: |
          ROCM_WHEELS_BASE_URL="https://d22q5eopkfeftw.cloudfront.net"
          WHEELS_PATH="rocm-wheels/${{ github.repository }}/${{ github.ref_name }}/${{ matrix.rocm.release-version }}/release-validation/${{ github.run_number }}/${{ github.run_attempt }}"
          WHEELS_URL="${ROCM_WHEELS_BASE_URL}/${WHEELS_PATH}"
          echo "Downloading ROCm wheels from ${WHEELS_URL}..."
          PYTHON_MAJOR_MINOR=$(echo "${{ matrix.python }}" | tr -d '.')
          LISTING=$(curl -fsSL "${WHEELS_URL}/")
          PJRT_FILE=$(echo "$LISTING" | grep -oE 'href="[^"]+\.whl"' | cut -d'"' -f2 | grep "jax_rocm7_pjrt-" | head -n1)
          PLUGIN_FILE=$(echo "$LISTING" | grep -oE 'href="[^"]+\.whl"' | cut -d'"' -f2 | grep "jax_rocm7_plugin-" | grep "cp${PYTHON_MAJOR_MINOR}" | head -n1)
          curl -L -o "$(pwd)/dist/${PJRT_FILE}" "${WHEELS_URL}/${PJRT_FILE}"
          curl -L -o "$(pwd)/dist/${PLUGIN_FILE}" "${WHEELS_URL}/${PLUGIN_FILE}"
      - name: Install Python dependencies
        run: |
          $JAXCI_PYTHON -m pip install uv~=0.11.2
          $JAXCI_PYTHON -m uv pip install -r build/test-requirements.txt
          $JAXCI_PYTHON -m pip install pytest-json-report
      - name: Wait For Connection
        uses: google-ml-infra/actions/ci_connection@7f5ca0c263a81ed09ea276524c1b9192f1304e3c
        with:
          halt-dispatch-input: ${{ inputs.halt-for-connection }}
      - name: Run Pytest ROCm tests
        timeout-minutes: 120
        run: ./ci/run_pytest_rocm.sh
