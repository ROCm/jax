name: Build docker

on:
  workflow_call:
    inputs:
      rocm-version:
        required: true
        type: string
      runner-label:
        required: false
        type: string
      artifact-prefix:
        required: false
        default: 'plugin_wheels'
        type: string
      extra-cr-tag:
        required: false
        type: string

jobs:
  build-docker:
    runs-on: ${{ fromJSON(inputs.runner-label) }}
    steps:
      - name: Clean up old runs
        run: |
          ls -lah
          # Make sure that we own all of the files so that we have permissions to delete them
          docker run --rm -v "./:/rocm-jax" ubuntu \
            /bin/bash -c "shopt -s dotglob; chown -R $UID /rocm-jax/* || true"
          # Remove any old work directories from this machine
          rm -rf * || true
          ls -lah
          # Clean up any docker stuff that's more than a week old
          docker system prune -a --filter "until=168h"
          # Stop any containers running for more than 12 hours. No CI job should take this long.
          docker ps --format="{{.RunningFor}} {{.Names}}" | grep hours \
              | awk -F: '{if($1>12)print$1}' | awk ' {print $4} ' | xargs docker stop || true
      - name: Print system info
        run: |
          whoami
          printenv
          df -h
          rocm-smi -a || true
          rocminfo | grep gfx || true
      - uses: actions/checkout@v4
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}_r${{ inputs.rocm-version }}
          path: ./wheelhouse
      - name: Authenticate to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push JAX docker image
        run: |
          working-directory: ./build/rocm/docker/
          docker build  -f Dockerfile.rocm \
          --build-arg ROCM_VERSION="${{ inputs.rocm-version }}" \
          -t "ghcr.io/rocm/jax-ubu22.rocm"${{ inputs.rocm-version }}":latest" .
          docker push "ghcr.io/rocm/jax-ubu22.rocm"${{ inputs.rocm-version }}":latest"
