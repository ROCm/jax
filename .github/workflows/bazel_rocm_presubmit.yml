name: Bazel ROCm

on:
  workflow_dispatch:
    inputs:
      halt-for-connection:
        description: 'Should this workflow run wait for a remote connection?'
        type: choice
        required: true
        default: 'no'
        options:
        - 'yes'
        - 'no'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Don't cancel in-progress jobs for main/release branches.
  cancel-in-progress: ${{ !contains(github.ref, 'release/') && github.ref != 'main' }}
permissions: {}
jobs:
  run-tests:
    if: github.event.repository.fork == false && (github.repository_owner == 'jax-ml' || github.repository_owner == 'ROCm')
    uses: ./.github/workflows/bazel_rocm.yml
# Begin Presubmit Naming Check - name modification requires internal check to be updated
    strategy:
        fail-fast: false # don't cancel all jobs on failure
        matrix:
          python: ["3.14"]
          runner: ["linux-x86-64-1gpu-amd"]
          jaxlib-version: ["head", "pypi_latest"]
          enable-x64: [1]
          rocm-version: ["7"]
    name: "${{ matrix.runner && 'Test' }}"
# End Presubmit Naming Check github-rocm-presubmits
    with:
      runner: ${{ matrix.runner }}
      python: ${{ matrix.python }}
      download-jax-from-gcs: 0
      skip-download-jaxlib-and-plugins-from-gcs: 0
      jaxlib-version: ${{ matrix.jaxlib-version }}
      halt-for-connection: ${{ inputs.halt-for-connection }}
      rocm-version: ${{ matrix.rocm-version }}
      enable-x64:  ${{ matrix.enable-x64 }}
      build_jaxlib: ${{ (matrix.jaxlib-version == 'head' && 'wheel') || 'false' }}
      build_jax: ${{ 'true' }}
      gate-targets-file: "build/rocm/ci_test_targets.txt"
      run_multiaccelerator_tests: ${{ 'false' }}
      clone_main_xla: 0

  blocking-gate:
    if: github.repository_owner == 'jax-ml' || github.repository_owner == 'ROCm'
    uses: ./.github/workflows/bazel_rocm.yml
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
        runner: ["linux-x86-64-2gpu-amd"]
        rocm:
          - {label: "ROCm 7.2.0",     tag: "rocm720",        release-version: "7.2.0",        s3-version: "0.11.0/7.2.0",          experimental: false}
          - {label: "TheRock 7.13",   tag: "therock-7.13.0", release-version: "therock-7.13.0", s3-version: "0.11.0/therock-7.13.0", experimental: true}
          - {label: "TheRock latest", tag: "therock-latest",  release-version: "therock-latest", s3-version: "0.11.0/therock-latest", experimental: true}
# Begin Presubmit Naming Check - name modification requires internal check to be updated
    name: "ROCm blocking gate (${{ matrix.rocm.label }})"
# End Presubmit Naming Check github-rocm-blocking-presubmits
    continue-on-error: ${{ matrix.rocm.experimental }}
    with:
      runner: ${{ matrix.runner }}
      python: ${{ matrix.python }}
      rocm-version: "7"
      rocm-tag: ${{ matrix.rocm.tag }}
      rocm-release-version: ${{ matrix.rocm.release-version }}
      download-jax-from-gcs: 0
      jaxlib-version: "head"
      build_jaxlib: "false"
      build_jax: "true"
      skip-download-jaxlib-and-plugins-from-gcs: 0
      s3_download_uri: "s3://jax-ci-amd/rocm-wheels/releases/${{ matrix.rocm.s3-version }}"
      gate-targets-file: "build/rocm/ci_blocking_test_targets.txt"
      gpu-config: "rocm_gate"
      run_multiaccelerator_tests: "false"
      clone_main_xla: 0
