# CI - Wheel Tests (Continuous) - TheRock only
#
# Stripped-down version of the continuous workflow for testing TheRock
# CI integration. Only TheRock jobs are kept. Non-AMD jobs
# (build-jax-artifact, build-jaxlib-artifact, CPU/CUDA/TPU) are
# removed. run-pytest-rocm uses nightly jaxlib + S3 ROCm artifacts.
# run-bazel-test-rocm builds from source so it is self-contained.

name: CI - Wheel Tests (Continuous)
permissions:
  id-token: write
  contents: read
  actions: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: >-
    ${{ !contains(github.ref, 'release/')
        && github.ref != 'main' }}

jobs:
  build-rocm-artifacts:
    uses: ./.github/workflows/build_rocm_artifacts.yml
    permissions:
      id-token: write
      contents: read
      actions: read
    strategy:
        fail-fast: false
        matrix:
          runner: ["linux-x86-64-1gpu-amd"]
          artifact: ["jax-rocm-plugin", "jax-rocm-pjrt"]
          python: ["3.11"]
          rocm:
            - version: "7"
              backend: "therock"
              container-image: >-
                ghcr.io/rocm/jax-manylinux_2_28-therock-latest:latest
          exclude:
            - artifact: "jax-rocm-pjrt"
              python: "3.12"
    name: >-
      Build ROCm (${{ matrix.rocm.backend }}) artifacts
    with:
      runner: ${{ matrix.runner }}
      artifact: ${{ matrix.artifact }}
      python: ${{ matrix.python }}
      rocm-version: ${{ matrix.rocm.version }}
      clone_main_xla: 1
      upload_artifacts_to_s3: true
      s3_upload_uri: >-
        s3://jax-ci-amd/rocm-wheels/${{
          matrix.rocm.backend }}-continuous/${{
          github.run_number }}/${{ github.run_attempt }}
      container-image: ${{ matrix.rocm.container-image }}

  run-pytest-rocm:
    if: ${{ !cancelled() }}
    needs: [build-rocm-artifacts]
    uses: ./.github/workflows/pytest_rocm.yml
    strategy:
        fail-fast: false
        matrix:
          runner:
            - "linux-x86-64-1gpu-amd"
          python: ["3.11"]
          rocm:
            - version: "7"
              backend: "therock"
              container-image: >-
                ghcr.io/rocm/jax-base-therock-ubu24.therock-latest:latest
    name: >-
      Pytest ROCm (${{ matrix.rocm.backend }},
      JAX = ${{ format('{0}', 'head') }})
    with:
      runner: ${{ matrix.runner }}
      python: ${{ matrix.python }}
      rocm-version: ${{ matrix.rocm.version }}
      rocm-tag: ${{ matrix.rocm.tag }}
      jaxlib-version: "head"
      gcs_download_uri: 'gs://jax-nightly-artifacts/latest'
      s3_download_uri: >-
        s3://jax-ci-amd/rocm-wheels/${{
          matrix.rocm.backend }}-continuous/${{
          github.run_number }}/${{ github.run_attempt }}
      container-image: ${{ matrix.rocm.container-image }}

  run-bazel-test-rocm:
    if: ${{ !cancelled() }}
    needs: [build-rocm-artifacts]
    uses: ./.github/workflows/bazel_rocm.yml
    strategy:
        fail-fast: false
        matrix:
          runner:
            - "linux-x86-64-1gpu-amd"
          python: ["3.11"]
          enable-x64: [0]
          rocm:
            - version: "7"
              backend: "therock"
              container-image: >-
                ghcr.io/rocm/jax-dev-therock-ubu24.therock-latest:latest
    name: >-
      Bazel ROCm (${{ matrix.rocm.backend }},
      JAX = ${{ format('{0}', 'head') }})
    with:
      runner: ${{ matrix.runner }}
      python: ${{ matrix.python }}
      rocm-version: ${{ matrix.rocm.version }}
      rocm-tag: ${{ matrix.rocm.tag }}
      enable-x64: ${{ matrix.enable-x64 }}
      build_jaxlib: "wheel"
      build_jax: "wheel"
      jaxlib-version: "head"
      run_multiaccelerator_tests: "false"
      clone_main_xla: 1
      container-image: ${{ matrix.rocm.container-image }}
